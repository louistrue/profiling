[package]
name = "widebench"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "widebench-native"
path = "src/main.rs"

[dependencies]
bnum = { version = "0.14.4", features = ["numtraits"] }
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[workspace]
