[package]
name = "ifclite-dump"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ifclite-dump"
path = "src/main.rs"

[[bin]]
name = "thickness"
path = "src/thickness.rs"

# NOTE (2026-07-17): the Manifold/BSP kernel split is gone — ifc-lite M9
# consolidated on ONE pure-Rust exact CSG kernel, and the old
# `manifold-csg` feature no longer exists in ifc-lite-geometry. Every
# deployment (browser WASM, server, CLI) now runs the same kernel, so a
# plain default build IS the production path.

[dependencies]
ifc-lite-processing = { path = "../../../ifc-lite/rust/processing" }
ifc-lite-geometry = { path = "../../../ifc-lite/rust/geometry", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
