[package]
name = "ifclite-dump"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ifclite-dump"
path = "src/main.rs"

[dependencies]
ifc-lite-processing = { path = "../../../ifc-lite/rust/processing" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
