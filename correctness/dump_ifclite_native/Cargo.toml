[package]
name = "ifclite-dump"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ifclite-dump"
path = "src/main.rs"

[features]
# Default to the Manifold C++ CSG kernel, matching production browser/desktop
# (WASM `manifold-csg-wasm-uu`; native desktop default `manifold-csg`). Build
# with `--no-default-features` to exercise the legacy BSP path the native
# server (`@ifc-lite/server-bin`, `apps/server`) actually runs, so the
# correctness comparison can cover BOTH production kernels. Without selecting a
# kernel here, `ifc-lite-processing` pulls geometry with `default-features =
# false` (BSP) — testing a kernel only the server uses.
default = ["manifold"]
manifold = ["ifc-lite-geometry/manifold-csg"]

[dependencies]
ifc-lite-processing = { path = "../../../ifc-lite/rust/processing" }
ifc-lite-geometry = { path = "../../../ifc-lite/rust/geometry", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
