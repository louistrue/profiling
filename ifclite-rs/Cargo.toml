[package]
name = "ifclite-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ifclite-bench"
path = "src/main.rs"

[dependencies]
ifc-lite-processing = { path = "../../ifc-lite/rust/processing" }
ifc-lite-core = { path = "../../ifc-lite/rust/core" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'
overflow-checks = false

[workspace]
